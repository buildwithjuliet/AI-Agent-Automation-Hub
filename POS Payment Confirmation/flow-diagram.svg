<svg width="1200" height="420" viewBox="0 0 1200 420" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a1e15"/>
      <stop offset="1" stop-color="#150e09"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#e08a4f"/>
    </marker>
  </defs>
  <rect width="1200" height="420" fill="url(#bg)"/>
  <text x="600" y="52" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="26" font-weight="800" fill="#f4ead9">Trust the provider's record, not the screen</text>

  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <g>
      <rect x="40" y="100" width="200" height="130" rx="16" fill="#3a2a1d" stroke="#e08a4f" stroke-opacity="0.5"/>
      <text x="140" y="138" font-size="15" font-weight="700" fill="#e08a4f">1</text>
      <text x="140" y="168" font-size="17" font-weight="700" fill="#f4ead9">Customer pays</text>
      <text x="140" y="192" font-size="17" font-weight="700" fill="#f4ead9">at the POS</text>
      <text x="140" y="216" font-size="17" font-weight="700" fill="#f4ead9">terminal</text>
    </g>
    <g>
      <rect x="270" y="100" width="200" height="130" rx="16" fill="#3a2a1d" stroke="#e08a4f" stroke-opacity="0.5"/>
      <text x="370" y="138" font-size="15" font-weight="700" fill="#e08a4f">2</text>
      <text x="370" y="168" font-size="17" font-weight="700" fill="#f4ead9">Moniepoint sends</text>
      <text x="370" y="192" font-size="17" font-weight="700" fill="#f4ead9">a signed</text>
      <text x="370" y="216" font-size="17" font-weight="700" fill="#f4ead9">webhook</text>
    </g>
    <g>
      <rect x="500" y="100" width="200" height="130" rx="16" fill="#3a2a1d" stroke="#e08a4f" stroke-opacity="0.5"/>
      <text x="600" y="138" font-size="15" font-weight="700" fill="#e08a4f">3</text>
      <text x="600" y="168" font-size="17" font-weight="700" fill="#f4ead9">n8n checks the</text>
      <text x="600" y="192" font-size="17" font-weight="700" fill="#f4ead9">signature is</text>
      <text x="600" y="216" font-size="17" font-weight="700" fill="#f4ead9">genuine</text>
    </g>
    <g>
      <rect x="730" y="100" width="200" height="130" rx="16" fill="#3a2a1d" stroke="#e08a4f" stroke-opacity="0.5"/>
      <text x="830" y="138" font-size="15" font-weight="700" fill="#e08a4f">4</text>
      <text x="830" y="168" font-size="17" font-weight="700" fill="#f4ead9">Only completed</text>
      <text x="830" y="192" font-size="17" font-weight="700" fill="#f4ead9">transactions</text>
      <text x="830" y="216" font-size="17" font-weight="700" fill="#f4ead9">pass</text>
    </g>
    <g>
      <rect x="960" y="100" width="200" height="130" rx="16" fill="#3a2a1d" stroke="#8fbf7a" stroke-opacity="0.8"/>
      <text x="1060" y="138" font-size="15" font-weight="700" fill="#8fbf7a">5</text>
      <text x="1060" y="168" font-size="17" font-weight="700" fill="#f4ead9">Merchant gets a</text>
      <text x="1060" y="192" font-size="17" font-weight="700" fill="#f4ead9">WhatsApp</text>
      <text x="1060" y="216" font-size="17" font-weight="700" fill="#f4ead9">confirmation</text>
    </g>
  </g>

  <g stroke="#e08a4f" stroke-width="2.5" marker-end="url(#arrow)" fill="none">
    <line x1="244" y1="165" x2="266" y2="165"/>
    <line x1="474" y1="165" x2="496" y2="165"/>
    <line x1="704" y1="165" x2="726" y2="165"/>
    <line x1="934" y1="165" x2="956" y2="165"/>
  </g>

  <rect x="40" y="280" width="1120" height="100" rx="18" fill="none" stroke="#e08a4f" stroke-opacity="0.6" stroke-dasharray="6 6"/>
  <g font-family="Inter,system-ui,sans-serif" text-anchor="middle">
    <text x="600" y="322" font-size="22" font-weight="800" fill="#f4ead9">No confirmation? Something is wrong.</text>
    <text x="600" y="354" font-size="18" font-weight="500" fill="#d3bfa8">Whatever the terminal or the customer's screen says, check before releasing cash or goods.</text>
  </g>
</svg>
