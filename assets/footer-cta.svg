<svg width="1120" height="70" viewBox="0 0 1120 70" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#3a281c"/>
      <stop offset="100%" stop-color="#1c130d"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.65">
      <stop offset="0%" stop-color="#e6935a" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#e6935a" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1120" height="70" rx="10" fill="url(#bg)"/>
  <rect x="0.75" y="0.75" width="1118.5" height="68.5" rx="9.5" fill="none" stroke="#e08a4f" stroke-opacity="0.35" stroke-width="1.5"/>

  <ellipse cx="560" cy="35" rx="240" ry="30" fill="url(#glow)">
    <animate attributeName="opacity" values="0.1;0.85;0.1"
      keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      dur="2.4s" repeatCount="indefinite"/>
    <animate attributeName="rx" values="220;300;220"
      keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      dur="2.4s" repeatCount="indefinite"/>
  </ellipse>

  <text x="560" y="41" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-size="21" font-weight="800" letter-spacing="-0.2" fill="#f7efe2">
    Let&#8217;s get you scaling faster.
    <animate attributeName="opacity" values="0.6;1;0.6"
      keyTimes="0;0.5;1" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"
      dur="2.4s" repeatCount="indefinite"/>
  </text>
</svg>
